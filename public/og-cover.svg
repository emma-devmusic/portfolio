<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">Portfolio de Emmanuel</title>
  <desc id="cover-description">Frontend Developer especializado en React y TypeScript</desc>
  <defs>
    <linearGradient id="cover-background" x1="0" y1="630" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#001021"/>
      <stop offset="1" stop-color="#101d42"/>
    </linearGradient>
    <linearGradient id="accent" x1="340" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25d9ff"/>
      <stop offset=".52" stop-color="#168cff"/>
      <stop offset="1" stop-color="#8a66ff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#58bcff" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#cover-background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="930" cy="315" r="188" fill="#17cfff" fill-opacity=".1" filter="url(#glow)"/>

  <g transform="translate(842 185)">
    <rect width="260" height="260" rx="55" fill="#091a38" stroke="#35dfff" stroke-opacity=".3" stroke-width="2"/>
    <path d="m91 39-43 182" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="square"/>
    <path d="m128 84 82 47-82 47" fill="none" stroke="#fff" stroke-width="36" stroke-linejoin="miter"/>
  </g>

  <text x="92" y="223" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">
    Hola, soy
  </text>
  <text x="88" y="322" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="-3">
    EMMANUEL
  </text>
  <rect x="92" y="358" width="570" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="92" y="428" fill="#d8e8f8" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" letter-spacing="5">
    FRONTEND DEVELOPER
  </text>
  <text x="92" y="487" fill="#91aac2" font-family="Arial, Helvetica, sans-serif" font-size="25">
    React · TypeScript · Experiencias web modernas
  </text>
</svg>
